name: M450 Grenzwerttests

on:
  push:
    paths:
      - "aufgaben-app/**"
      - ".github/workflows/grenzwerttests.yml"
  pull_request:
    paths:
      - "aufgaben-app/**"
      - ".github/workflows/grenzwerttests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Test all required and advanced cases
        working-directory: aufgaben-app
        run: bash gradlew clean test --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-java-${{ matrix.java }}
          path: |
            aufgaben-app/build/reports/tests/test/
            aufgaben-app/build/test-results/test/
